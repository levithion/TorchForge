name: Feature request
description: Propose a focused improvement to TorchForge
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PDF extraction
        - Vision/topology parsing
        - PyTorch code generation
        - Runtime validation
        - Browser workspace
        - CLI or API
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request does not include credentials or private paper content.
          required: true
