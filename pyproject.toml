[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchforge"
version = "0.5.0"
description = "Local research-paper-to-PyTorch pipeline with a web workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "PyMuPDF>=1.24,<2",
    "torch>=2.4,<3",
    "uvicorn>=0.30,<1",
    "watchdog>=4,<7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
reference = [
    "transformers>=4.45,<5",
]

[project.scripts]
torchforge = "torchforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/torchforge"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
